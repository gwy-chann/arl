<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARLQ Inventory and Sales System</title>
<meta name="description" content="ARLQ Food Condiments Trading: inventory monitoring and sales system for toyo, suka and patis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;450;500;550;600;650;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
(function(){
  try{
    var s=localStorage.getItem('arlq-theme')||'auto';
    var d=s==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;
    if(d==='dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
